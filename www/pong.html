<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pong Loader</title>
  <style>
    canvas {
      background: black;
      display: block;
      margin: auto;
    }
  </style>
</head>
<body>
<canvas id="pong" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById("pong");
const ctx = canvas.getContext("2d");

const paddleWidth = 10, paddleHeight = 100, ballSize = 10;
let playerY = canvas.height / 2 - paddleHeight / 2;
let aiY = canvas.height / 2 - paddleHeight / 2;
let ballX = canvas.width / 2, ballY = canvas.height / 2;
let ballSpeedX = 4, ballSpeedY = 2;

document.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  playerY = e.clientY - rect.top - paddleHeight / 2;
});

function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawCircle(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.fill();
}

function resetBall() {
  ballX = canvas.width / 2;
  ballY = canvas.height / 2;
  ballSpeedX = -ballSpeedX;
}

function update() {
  ballX += ballSpeedX;
  ballY += ballSpeedY;

  if (ballY + ballSize > canvas.height || ballY - ballSize < 0) {
    ballSpeedY = -ballSpeedY;
  }

  // player paddle collision
  if (ballX - ballSize < paddleWidth &&
      ballY > playerY && ballY < playerY + paddleHeight) {
    ballSpeedX = -ballSpeedX;
  }

  // ai paddle collision
  if (ballX + ballSize > canvas.width - paddleWidth &&
      ballY > aiY && ballY < aiY + paddleHeight) {
    ballSpeedX = -ballSpeedX;
  }

  // ai movement
  aiY += ((ballY - (aiY + paddleHeight / 2))) * 0.09;

  // score conditions
  if (ballX < 0 || ballX > canvas.width) {
    resetBall();
  }
}

function render() {
  drawRect(0, 0, canvas.width, canvas.height, "black");
  drawRect(0, playerY, paddleWidth, paddleHeight, "white");
  drawRect(canvas.width - paddleWidth, aiY, paddleWidth, paddleHeight, "white");
  drawCircle(ballX, ballY, ballSize, "white");
}

function game() {
  update();
  render();
}

setInterval(game, 1000 / 60);
</script>
</body>
</html>
