name: Deploy to shinyapps.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to match renv.lock and the Dockerfile's rocker/shiny:4.5.
      #
      # Left unpinned this tracks whatever R is current, and it drifted onto
      # 4.6, where R_NamespaceRegistry is no longer declared. cpp11 0.5.3 —
      # the version renv.lock pins — still references it, so igraph failed to
      # compile and renv::restore() aborted before the deploy step ran. The
      # Docker build was unaffected because it pins its R; this was the only
      # place R was free to move.
      #
      # Keep this in step with renv.lock's R version and the Dockerfile base
      # image. Moving to a newer R means changing all three together.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            perl \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libbz2-dev \
            liblzma-dev \
            libglpk-dev \
            libmagick++-dev \
            libnode-dev \
            chromium

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            rsconnect::deployApp(
              appName     = "conduit-summit",
              forceUpdate = TRUE,
              logLevel    = "verbose"
            )
          '
