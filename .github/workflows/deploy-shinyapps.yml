name: Deploy to shinyapps.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to match renv.lock and the Dockerfile's rocker/shiny:4.5.
      #
      # Left unpinned this tracks whatever R is current, and it drifted onto
      # 4.6, where R_NamespaceRegistry is no longer declared. cpp11 0.5.3 —
      # the version renv.lock pins — still references it, so igraph failed to
      # compile and renv::restore() aborted before the deploy step ran. The
      # Docker build was unaffected because it pins its R; this was the only
      # place R was free to move.
      #
      # Keep this in step with renv.lock's R version and the Dockerfile base
      # image. Moving to a newer R means changing all three together.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            perl \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libbz2-dev \
            liblzma-dev \
            libglpk-dev \
            libmagick++-dev \
            libnode-dev \
            chromium

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2

      # rsconnect refuses to bundle the app when the library and the lockfile
      # disagree, and being in sync is a property of a MACHINE, not of the
      # repository. The step above restores from the lockfile, but the record
      # renv writes for a restored package can still differ from the record
      # made wherever the snapshot was taken — a package installed here comes
      # from RSPM's Linux binaries and is recorded as such, while the same
      # package snapshotted on a developer's macOS may say CRAN. Same version,
      # different provenance, and renv counts that as out of sync.
      #
      # So the lockfile is realigned against the library that was actually
      # restored, here in the runner. Nothing is committed: this only makes
      # the bundle self-consistent so rsconnect will build it. Versions are
      # unaffected — they came from the committed lockfile a step ago.
      #
      # status() is printed first because when this breaks again, the list of
      # disagreeing packages is the whole diagnosis, and rsconnect's own error
      # does not include it.
      - name: Align the lockfile with the restored library
        run: |
          Rscript -e '
            cat("── renv::status() as restored ──\n")
            try(print(renv::status()))
            cat("── realigning ──\n")
            renv::snapshot(prompt = FALSE)
          '

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            rsconnect::deployApp(
              appName     = "conduit-summit",
              forceUpdate = TRUE,
              logLevel    = "verbose"
            )
          '
